services:
  - type: web
    name: devplatform-api
    runtime: node
    plan: free
    rootDir: apps/backend
    # TypeScript is a devDependency, so install dev deps explicitly before building
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: devplatform-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Public URL of the frontend (e.g. https://your-app.vercel.app), used for CORS and Socket.IO
      - key: CLIENT_URL
        sync: false

  # Redis-compatible store used by BullMQ (AI job queue) and caching
  - type: keyvalue
    name: devplatform-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
